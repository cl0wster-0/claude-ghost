name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build exe and installer
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { ./build.ps1 -Version "${{ github.ref_name }}" } else { ./build.ps1 }

      - uses: actions/upload-artifact@v5
        with:
          name: ClaudeGhost-Setup
          path: dist/ClaudeGhost-Setup.exe

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeGhost-Setup.exe
