name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Публикация релиза на GitHub (тег vX.Y.Z) -> сборка этой версии и установщик в релиз
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build exe and installer
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") { ./build.ps1 -Version "${{ github.event.release.tag_name }}" } else { ./build.ps1 }

      - uses: actions/upload-artifact@v5
        with:
          name: ClaudeGhost-Setup
          path: dist/ClaudeGhost-Setup.exe

      - name: Attach installer to the release (plain .exe, not zipped)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/ClaudeGhost-Setup.exe
